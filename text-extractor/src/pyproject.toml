[project]
name = "text-extractor"
version = "0.1.0"
description = "Invoice PDF to layout-preserving markdown (see ../specs)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "minio>=7.2.20",
    "pdfplumber>=0.11.10",
    "pika>=1.4.4",
]

[project.scripts]
text-extractor = "text_extractor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["text_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs RabbitMQ and MinIO (AMQP_URL, MINIO_*)",
    "smoke: needs a running text-extractor plus RabbitMQ and MinIO",
    "corpus: regression over tester/datasets/run-001 (on demand)",
]
addopts = "-m 'not integration and not smoke and not corpus'"

[dependency-groups]
dev = [
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
