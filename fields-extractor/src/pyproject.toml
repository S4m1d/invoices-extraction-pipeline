[project]
name = "fields-extractor"
version = "0.1.0"
description = "Invoice layout markdown to structured JSON via an LLM (see ../specs)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.14.0",
    "minio>=7.2.20",
    "pika>=1.4.4",
    "pydantic>=2.14.1",
]

[project.scripts]
fields-extractor = "fields_extractor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fields_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs RabbitMQ and MinIO (AMQP_URL, MINIO_*)",
    "smoke: needs a running fields-extractor plus RabbitMQ and MinIO; calls the LLM API",
    "llm: calls the real LLM API (costs money; on demand)",
]
addopts = "-m 'not integration and not smoke and not llm'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
