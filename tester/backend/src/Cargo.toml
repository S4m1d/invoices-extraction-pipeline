[package]
name = "tester-backend"
version = "0.1.0"
edition = "2024"
description = "Testing client backend (tester/backend/specs)"
publish = false

[[bin]]
name = "tester"
path = "main.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.152.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
duckdb = { version = "1.10506.1", features = ["bundled", "json"] }
futures = "0.3.34"
lapin = "4.12.3"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "json"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "uuid", "chrono", "rust_decimal", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
